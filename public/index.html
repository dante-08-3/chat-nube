<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Nube - Iniciar sesión</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <form id="formLogin" class="login-card" autocomplete="off">
    <div class="logo">💬</div>
    <h1>Chat Nube</h1>
    <p class="sub">Inicia sesión o crea tu cuenta</p>

    <label class="campo">
      <span>Usuario</span>
      <input type="text" name="usuario" required minlength="3" maxlength="20" placeholder="ej. fredy">
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input type="password" name="password" required minlength="4" placeholder="••••••">
    </label>

    <div class="botones">
      <button type="submit" value="login" class="btn btn-primario">Entrar</button>
      <button type="submit" value="registro" class="btn btn-secundario">Crear cuenta</button>
    </div>

    <p id="error" class="error"></p>
  </form>

  <script src="/js/login.js"></script>
</body>
</html>
